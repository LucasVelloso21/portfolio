  <circle cx="104" cy="67" r="5" fill="#5b8cff"/>
  <circle cx="122" cy="67" r="5" fill="#2c3350"/>
  <circle cx="140" cy="67" r="5" fill="#2c3350"/>
  <!-- tema claro/escuro -->
  <rect x="672" y="59" width="32" height="16" rx="8" fill="#2c3350"/>
